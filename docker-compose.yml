services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xpower_production
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://your-domain.com}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-X Power Program}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-secure-production-key}
      - NEXT_PUBLIC_ENABLE_DEMO_SANDBOX=${NEXT_PUBLIC_ENABLE_DEMO_SANDBOX:-false}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
